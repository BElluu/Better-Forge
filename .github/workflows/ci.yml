name: CI

# Runs on pull requests only: the ruleset on main requires a pull request, and a branch that is up to date with main,
# so what was checked there is what lands on main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Icon fonts are up to date
        run: npm run check:icons

      - name: Package manifests
        run: npm run check:packages

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test:coverage && npx tsx --test packages/*/test/*.test.ts apps/template/test/*.test.ts

      - name: Each package on its own
        run: npm run test:isolation

      - name: What gets published
        run: |
          for dir in packages/*/; do npx publint "$dir" --strict; done
          npm pack --dry-run --workspaces --include-workspace-root=false > /dev/null

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Template end-to-end tests
        run: npm run test:e2e:template

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
