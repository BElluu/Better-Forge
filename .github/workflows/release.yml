name: Release

# Every push to main looks for changesets. With some, it opens (or updates) a "Version packages" pull request; merging
# that pull request publishes every package to npm at the new version and creates the GitHub release.
#
# Publishing uses npm trusted publishing: the job proves who it is with an OIDC token, so no npm token is stored.
# CHANGESETS_TOKEN is a fine-grained token limited to this repository (contents and pull requests: write); a pull
# request opened with the default token would not start the CI checks, and could not be merged.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version packages or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "Version packages"
          title: "Version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

      - name: GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(echo "$PUBLISHED" | jq -r '.[0].version')
          gh release create "v$version" --title "v$version" --generate-notes
