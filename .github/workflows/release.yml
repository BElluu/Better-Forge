name: Release

# A push to main that carries changesets releases the packages: the job raises the versions, commits "Version packages"
# to main, publishes every package to npm and creates the GitHub release. A push without changesets does nothing.
# Quality is checked on the pull request, which the ruleset on main requires, so it is not repeated here.
#
# Publishing uses npm trusted publishing: the job proves who it is with an OIDC token, so no npm token is stored.
# CHANGESETS_TOKEN is a fine-grained token limited to this repository (contents: write); the ruleset on main lets its
# owner (a repository admin) push the version commit. The "Version packages" commit itself is skipped, and a release
# that stopped half way is finished by running this workflow by hand (Actions -> Release -> Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Version packages'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Raise the versions
        run: |
          if ls .changeset/*.md | grep -qv 'README.md'; then
            npm run version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Version packages"
            git push origin HEAD:main
          else
            echo "No changesets."
          fi

      - name: Publish
        id: publish
        run: |
          set -o pipefail
          npm run release 2>&1 | tee publish.log
          if grep -q 'New tag:' publish.log; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
          git push origin --tags

      - name: GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
        run: |
          version=$(node -p "require('./packages/contracts/package.json').version")
          gh release create "v$version" --target "$(git rev-parse HEAD)" --title "v$version" --generate-notes
